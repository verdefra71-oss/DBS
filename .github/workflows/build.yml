name: Build Gestionale Scuola di Danza

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.3
          channel: stable
          cache: true
      - name: Create supported Flutter Android project
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/gestionale_source
          cp -R lib /tmp/gestionale_source/lib
          cp -R assets /tmp/gestionale_source/assets
          cp pubspec.yaml /tmp/gestionale_source/pubspec.yaml
          rm -rf /tmp/gestionale_app
          mkdir -p /tmp/gestionale_app
          cd /tmp/gestionale_app
          flutter create --no-pub --platforms=android,windows --org com.gestionalescuoladidanza --project-name gestionale_scuola_di_danza .
          rm -rf lib assets
          cp -R /tmp/gestionale_source/lib lib
          cp -R /tmp/gestionale_source/assets assets
          cp /tmp/gestionale_source/pubspec.yaml pubspec.yaml
          rm -rf test analysis_options.yaml
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gestionale-scuola-di-danza-apk
          path: /tmp/gestionale_app/build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Create supported Flutter Windows project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path C:\temp\dyn-source | Out-Null
          Copy-Item -Recurse -Force lib C:\temp\dyn-source\lib
          Copy-Item -Recurse -Force assets C:\temp\dyn-source\assets
          Copy-Item -Force pubspec.yaml C:\temp\dyn-source\pubspec.yaml
          if (Test-Path C:\temp\dynamique-app) { Remove-Item -Recurse -Force C:\temp\dynamique-app }
          New-Item -ItemType Directory -Force -Path C:\temp\dynamique-app | Out-Null
          Set-Location C:\temp\dynamique-app
          flutter create --no-pub --platforms=windows --org com.gestionalescuoladidanza --project-name gestionale_scuola_di_danza .
          if (Test-Path lib) { Remove-Item -Recurse -Force lib }
          if (Test-Path assets) { Remove-Item -Recurse -Force assets }
          Copy-Item -Recurse -Force C:\temp\dyn-source\lib lib
          Copy-Item -Recurse -Force C:\temp\dyn-source\assets assets
          Copy-Item -Force C:\temp\dyn-source\pubspec.yaml pubspec.yaml
          if (Test-Path test) { Remove-Item -Recurse -Force test }
          if (Test-Path analysis_options.yaml) { Remove-Item -Force analysis_options.yaml }
          flutter pub get
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          Remove-Item Env:CMAKE_GENERATOR -ErrorAction SilentlyContinue
          Remove-Item Env:CMAKE_GENERATOR_PLATFORM -ErrorAction SilentlyContinue
          Remove-Item Env:CMAKE_GENERATOR_INSTANCE -ErrorAction SilentlyContinue
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe non trovato" }
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "Visual Studio con strumenti C++ non trovato" }
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat non trovato: $vcvars" }
          cmd.exe /c "`"$vcvars`" > nul && set" | ForEach-Object {
            if ($_ -match '^(.*?)=(.*)$') { Set-Item -Path ("Env:" + $matches[1]) -Value $matches[2] }
          }
          flutter config --enable-windows-desktop
          flutter --version
          flutter build windows --release
      - name: Create Windows installer script
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          #define MyAppName "Gestionale Scuola di Danza"
          #define MyAppVersion "1.0.0"
          #define MyAppPublisher "Gestionale Scuola di Danza"
          #define MyAppExeName "gestionale_scuola_di_danza.exe"

          [Setup]
          AppId={{7D0B1D7B-7A5C-4B3C-9A9E-7F3E5C2B1A10}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          DefaultDirName={autopf}\Gestionale Scuola di Danza
          DefaultGroupName=Gestionale Scuola di Danza
          OutputDir=C:\temp\installer-output
          OutputBaseFilename=Gestionale-Scuola-di-Danza-Setup
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64
          UninstallDisplayName={#MyAppName}
          PrivilegesRequired=admin

          [Files]
          Source: "C:\temp\dynamique-app\build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Gestionale Scuola di Danza"; Filename: "{app}\{#MyAppExeName}"
          Name: "{autodesktop}\Gestionale Scuola di Danza"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Crea un collegamento sul desktop"; GroupDescription: "Collegamenti aggiuntivi:"

          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "Avvia Gestionale Scuola di Danza"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content -Encoding UTF8 C:\temp\gestionale-installer.iss

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup --yes --no-progress
          $iscc = @(
            "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:ChocolateyInstall\bin\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup 6 (ISCC.exe) non trovato dopo l'installazione" }
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:ISCC_PATH -or -not (Test-Path $env:ISCC_PATH)) { throw "ISCC.exe non disponibile" }
          New-Item -ItemType Directory -Force -Path C:\temp\installer-output | Out-Null
          & $env:ISCC_PATH C:\temp\gestionale-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Creazione installer fallita" }

      - name: Upload Windows portable build
        uses: actions/upload-artifact@v4
        with:
          name: gestionale-scuola-di-danza-windows
          path: C:\temp\dynamique-app\build\windows\x64\runner\Release\**

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: gestionale-scuola-di-danza-installer
          path: C:\temp\installer-output\Gestionale-Scuola-di-Danza-Setup.exe
